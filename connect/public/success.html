<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaic — Slack Connected</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 560px;
      padding: 48px 32px;
      width: 100%;
    }
    .check { font-size: 40px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #888; margin-bottom: 40px; font-size: 15px; }
    .step { margin-bottom: 28px; }
    .step-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 8px;
    }
    .command {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 14px 16px;
      font-family: "SF Mono", monospace;
      font-size: 13px;
      color: #0f0;
      position: relative;
      word-break: break-all;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #222;
      border: none;
      color: #aaa;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #333; color: #fff; }
    .note { color: #555; font-size: 13px; margin-top: 32px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Slack connected</h1>
    <p class="sub" id="team-name">Your workspace is ready.</p>

    <div class="step">
      <div class="step-label">Step 1 — Paste this Slack bot token into your terminal</div>
      <div class="command" id="cmd-box">
        <span id="cmd-text"></span>
        <button class="copy-btn" onclick="copyToken()">Copy</button>
      </div>
    </div>

    <div class="step">
      <div class="step-label">Step 2 — Start Mosaic</div>
      <div class="command">mosaic start</div>
    </div>

    <p class="note">Then @mention Mosaic in any Slack channel or DM it directly.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const team = params.get("team") || "your workspace";

    document.getElementById("team-name").textContent = team + " is connected.";

    document.getElementById("cmd-text").textContent = token;

    function copyToken() {
      navigator.clipboard.writeText(token);
      document.querySelector(".copy-btn").textContent = "Copied!";
      setTimeout(() => document.querySelector(".copy-btn").textContent = "Copy", 2000);
    }
  </script>
</body>
</html>
